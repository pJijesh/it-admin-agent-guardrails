name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Generated files are current
        run: node scripts/build.mjs --check
      - name: Run tests
        run: node --test
      - name: Safe examples and the template pass the checker
        run: node skills/it-admin-guardrails/scripts/check-ps.mjs examples/safe skills/it-admin-guardrails/templates
      - name: Install dry run for every agent
        run: node scripts/install.mjs all --dry-run
